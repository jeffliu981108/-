        function App() {
            // States
            const [orderType, setOrderType] = React.useState('外帶'); // 外帶 or 內用
            const [tableNo, setTableNo] = React.useState('');
            const [members, setMembers] = React.useState(['小明', '小華', '老闆']);
            const [currentMember, setCurrentMember] = React.useState('小明');
            const [newMemberName, setNewMemberName] = React.useState('');
            
            // Orders format: Array of { id, member, itemId, name, option, price, qty }
            const [orders, setOrders] = React.useState([
                { id: '1', member: '小明', itemId: 'p1', name: '招牌鍋貼', option: '', price: 7.0, qty: 10 },
                { id: '2', member: '小明', itemId: 's1', name: '酸辣湯', option: '', price: 35, qty: 1 },
                { id: '3', member: '小華', itemId: 'b1', name: '紅燒牛肉麵', option: '都加', price: 168, qty: 1 },
                { id: '4', member: '小華', itemId: 'dr1', name: '香濃豆漿 (330cc)', option: '', price: 20, qty: 1 },
                { id: '5', member: '老闆', itemId: 'p2', name: '韭菜鍋貼', option: '', price: 7.0, qty: 15 },
                { id: '6', member: '老闆', itemId: 'cs1', name: '珍珠抄手 (小顆8顆)', option: '紅油', price: 60, qty: 1 },
            ]);

            const [selectedCategory, setSelectedCategory] = React.useState('beef');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('menu'); // 'menu', 'memberCart', 'summary'
            const [modalItem, setModalItem] = React.useState(null); // Item currently being customized
            const [modalOption, setModalOption] = React.useState('');
            const [modalQty, setModalQty] = React.useState(1);
            const [toastMessage, setToastMessage] = React.useState('');

            // Notification Toast
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 2500);
            };

            // Add Member
            const handleAddMember = (e) => {
                e.preventDefault();
                const trimmed = newMemberName.trim();
                if (!trimmed) return;
                if (members.includes(trimmed)) {
                    showToast('該名字已存在！');
                    return;
                }
                setMembers([...members, trimmed]);
                setCurrentMember(trimmed);
                setNewMemberName('');
                showToast(`已新增成員：${trimmed}`);
            };

            // Delete Member
            const handleDeleteMember = (memberToDelete) => {
                if (members.length <= 1) {
                    showToast('至少需要保留一名點餐成員');
                    return;
                }
                setMembers(members.filter(m => m !== memberToDelete));
                setOrders(orders.filter(o => o.member !== memberToDelete));
                if (currentMember === memberToDelete) {
                    const remaining = members.filter(m => m !== memberToDelete);
                    setCurrentMember(remaining[0]);
                }
                showToast(`已刪除成員 ${memberToDelete}`);
            };

            // Open Item Customization Modal or Add direct
            const handleItemClick = (item) => {
                if (item.options && item.options.length > 0) {
                    setModalItem(item);
                    setModalOption(item.options[0]);
                    setModalQty(item.unit === '顆' ? 5 : 1);
                } else {
                    // Direct Add
                    const defaultQty = item.unit === '顆' ? 5 : 1;
                    addItemToOrder(item, '', defaultQty);
                }
            };

            // Add Item to Orders
            const addItemToOrder = (item, option, qty) => {
                // Check if existing order item exists for this member with same option
                const existingIndex = orders.findIndex(
                    o => o.member === currentMember && o.itemId === item.id && o.option === option
                );

                if (existingIndex > -1) {
                    const updated = [...orders];
                    updated[existingIndex].qty += qty;
                    setOrders(updated);
                } else {
                    const newOrder = {
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                        member: currentMember,
                        itemId: item.id,
                        name: item.name,
                        option: option,
                        price: item.price,
                        qty: qty
                    };
                    setOrders([...orders, newOrder]);
                }

                showToast(`已替【${currentMember}】加入 ${item.name} x${qty}`);
                setModalItem(null);
            };

            // Update order quantity
            const handleUpdateQty = (orderId, delta) => {
                setOrders(orders.map(o => {
                    if (o.id === orderId) {
                        const newQty = o.qty + delta;
                        return newQty > 0 ? { ...o, qty: newQty } : null;
                    }
                    return o;
                }).filter(Boolean));
            };

            // Remove single order item
            const handleRemoveOrderItem = (orderId) => {
                setOrders(orders.filter(o => o.id !== orderId));
            };

            // Calculate Totals
            const currentMemberOrders = orders.filter(o => o.member === currentMember);
            const currentMemberTotal = currentMemberOrders.reduce((sum, o) => sum + (o.price * o.qty), 0);
            
            const groupTotalAmount = orders.reduce((sum, o) => sum + (o.price * o.qty), 0);
            const groupTotalCount = orders.reduce((sum, o) => sum + o.qty, 0);

            // Group By Item Aggregation for Kitchen
            const kitchenSummary = React.useMemo(() => {
                const summary = {};
                orders.forEach(o => {
                    const key = o.option ? `${o.name} (${o.option})` : o.name;
                    if (!summary[key]) {
                        summary[key] = {
                            name: o.name,
                            option: o.option,
                            price: o.price,
                            totalQty: 0,
                            members: []
                        };
                    }
                    summary[key].totalQty += o.qty;
                    summary[key].members.push(`${o.member} x${o.qty}`);
                });
                return Object.values(summary);
            }, [orders]);

            // Member breakdown list
            const memberBreakdown = React.useMemo(() => {
                return members.map(m => {
                    const mOrders = orders.filter(o => o.member === m);
                    const total = mOrders.reduce((sum, o) => sum + (o.price * o.qty), 0);
                    return {
                        member: m,
                        orders: mOrders,
                        total
                    };
                });
            }, [members, orders]);

            // Copy Order Summary Text for Line
            const handleCopyText = () => {
                let text = `【八方雲集 團購點餐】\n`;
                text += `型態：${orderType}${orderType === '內用' && tableNo ? ` (桌號 ${tableNo})` : ''}\n`;
                text += `--------------------------\n`;
                text += `📋 廚房點餐總計（品項）：\n`;
                kitchenSummary.forEach(item => {
                    const key = item.option ? `${item.name} [${item.option}]` : item.name;
                    text += `• ${key} x ${item.totalQty} = $${item.price * item.totalQty}\n`;
                });
                text += `--------------------------\n`;
                text += `💰 各人算帳明細：\n`;
                memberBreakdown.forEach(mb => {
                    if (mb.orders.length > 0) {
                        text += `👤 ${mb.member} (小計: $${mb.total}):\n`;
                        mb.orders.forEach(o => {
                            const optStr = o.option ? `(${o.option})` : '';
                            text += `   - ${o.name}${optStr} x${o.qty}\n`;
                        });
                    } else {
                        text += `👤 ${mb.member}: 未點餐\n`;
                    }
                });
                text += `--------------------------\n`;
                text += `🔥 總計金額：$${groupTotalAmount} 元\n`;

                // Use document.execCommand for iframe compatibility
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('已複製完整的點餐與算帳清單！');
                } catch (err) {
                    showToast('複製失敗，請手動複製');
                }
                document.body.removeChild(textArea);
            };

            // Filter items by category & search
            const filteredItems = MENU_ITEMS.filter(item => {
                const matchesCategory = item.category === selectedCategory;
                const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase());
                return searchQuery ? matchesSearch : matchesCategory;
            });

            return (
                <div className="min-h-screen pb-24 md:pb-12 text-slate-800">
                    {}
                    {/* Header */}
                    <header className="bg-red-700 text-white shadow-md sticky top-0 z-30">
                        <div className="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
                            <div className="flex items-center space-x-2">
                                <span className="bg-yellow-400 text-red-900 font-extrabold text-xs px-2 py-1 rounded">八方雲集</span>
                                <h1 className="text-lg md:text-xl font-bold tracking-wide">多人團購點餐神器</h1>
                            </div>

                            {/* Order Type Selector */}
                            <div className="flex items-center space-x-2 bg-red-800 p-1 rounded-lg text-sm">
                                <button
                                    onClick={() => setOrderType('外帶')}
                                    className={`px-3 py-1 rounded-md font-medium transition-all ${orderType === '外帶' ? 'bg-white text-red-700 shadow-sm' : 'text-red-100 hover:text-white'}`}
                                >
                                    <i className="fa-solid fa-bag-shopping mr-1"></i> 外帶
                                </button>
                                <button
                                    onClick={() => setOrderType('內用')}
                                    className={`px-3 py-1 rounded-md font-medium transition-all ${orderType === '內用' ? 'bg-white text-red-700 shadow-sm' : 'text-red-100 hover:text-white'}`}
                                >
                                    <i className="fa-solid fa-utensils mr-1"></i> 內用
                                </button>
                                {orderType === '內用' && (
                                    <input
                                        type="text"
                                        placeholder="桌號"
                                        value={tableNo}
                                        onChange={(e) => setTableNo(e.target.value)}
                                        className="w-16 px-2 py-1 text-slate-800 rounded bg-white text-xs outline-none font-bold"
                                    />
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-2 rounded-full shadow-lg text-sm flex items-center space-x-2 animate-bounce">
                            <i className="fa-solid fa-circle-check text-green-400"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    <main className="max-w-5xl mx-auto px-4 py-4 space-y-4">
                        {}
                        {/* Active Member Selection Bar */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                <div className="flex items-center space-x-2 overflow-x-auto pb-1 sm:pb-0">
                                    <span className="text-xs font-bold text-slate-500 whitespace-nowrap">正在幫誰點餐：</span>
                                    <div className="flex items-center space-x-1.5">
                                        {members.map(m => (
                                            <div key={m} className="relative group">
                                                <button
                                                    onClick={() => setCurrentMember(m)}
                                                    className={`px-3 py-1.5 rounded-lg text-sm font-bold flex items-center space-x-1.5 transition-all ${
                                                        currentMember === m
                                                            ? 'bg-red-600 text-white shadow-md ring-2 ring-red-300'
                                                            : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                                                    }`}
                                                >
                                                    <i className="fa-solid fa-user text-xs"></i>
                                                    <span>{m}</span>
                                                    {orders.filter(o => o.member === m).length > 0 && (
                                                        <span className={`text-xs px-1.5 py-0.2 rounded-full ${currentMember === m ? 'bg-red-800 text-white' : 'bg-slate-300 text-slate-700'}`}>
                                                            {orders.filter(o => o.member === m).reduce((a, b) => a + b.qty, 0)}
                                                        </span>
                                                    )}
                                                </button>
                                                {members.length > 1 && (
                                                    <button
                                                        onClick={(e) => { e.stopPropagation(); handleDeleteMember(m); }}
                                                        className="absolute -top-1 -right-1 bg-slate-400 text-white hover:bg-red-500 w-4 h-4 rounded-full text-[10px] flex items-center justify-center shadow"
                                                        title="刪除此成員"
                                                    >
                                                        ×
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Add Member Input */}
                                <form onSubmit={handleAddMember} className="flex items-center space-x-2">
                                    <input
                                        type="text"
                                        placeholder="+ 新增點餐人"
                                        value={newMemberName}
                                        onChange={(e) => setNewMemberName(e.target.value)}
                                        className="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500 w-32 sm:w-36"
                                    />
                                    <button
                                        type="submit"
                                        className="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition-all"
                                    >
                                        加入
                                    </button>
                                </form>
                            </div>
                        </div>

                        {/* Navigation Tabs (Mobile & Desktop) */}
                        <div className="flex border-b border-slate-200 bg-white rounded-t-xl px-2 pt-2">
                            <button
                                onClick={() => setActiveTab('menu')}
                                className={`flex-1 py-2.5 text-center font-bold text-sm border-b-2 transition-all ${
                                    activeTab === 'menu'
                                        ? 'border-red-600 text-red-600'
                                        : 'border-transparent text-slate-500 hover:text-slate-800'
                                }`}
                            >
                                <i className="fa-solid fa-book-open mr-1.5"></i> 點餐菜單
                            </button>
                            <button
                                onClick={() => setActiveTab('memberCart')}
                                className={`flex-1 py-2.5 text-center font-bold text-sm border-b-2 relative transition-all ${
                                    activeTab === 'memberCart'
                                        ? 'border-red-600 text-red-600'
                                        : 'border-transparent text-slate-500 hover:text-slate-800'
                                }`}
                            >
                                <i className="fa-solid fa-cart-shopping mr-1.5"></i>【{currentMember}】的購物車
                                {currentMemberOrders.length > 0 && (
                                    <span className="ml-1 bg-red-600 text-white text-xs px-1.5 py-0.5 rounded-full">
                                        {currentMemberOrders.reduce((a, b) => a + b.qty, 0)}
                                    </span>
                                )}
                            </button>
                            <button
                                onClick={() => setActiveTab('summary')}
                                className={`flex-1 py-2.5 text-center font-bold text-sm border-b-2 relative transition-all ${
                                    activeTab === 'summary'
                                        ? 'border-red-600 text-red-600'
                                        : 'border-transparent text-slate-500 hover:text-slate-800'
                                }`}
                            >
                                <i className="fa-solid fa-calculator mr-1.5"></i> 團購結帳總計
                                {orders.length > 0 && (
                                    <span className="ml-1 bg-amber-500 text-white text-xs px-1.5 py-0.5 rounded-full">
                                        ${groupTotalAmount}
                                    </span>
                                )}
                            </button>
                        </div>

                        {}
                        {/* TAB 1: MENU SECTION */}
                        {activeTab === 'menu' && (
                            <div className="space-y-4">
                                {/* Search & Category Pills */}
                                <div className="bg-white p-3 rounded-xl shadow-sm border border-slate-200 space-y-3">
                                    <div className="relative">
                                        <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                        <input
                                            type="text"
                                            placeholder="搜尋餐點 (如: 牛肉麵、招牌鍋貼、豆漿)..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500"
                                        />
                                        {searchQuery && (
                                            <button
                                                onClick={() => setSearchQuery('')}
                                                className="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-slate-600"
                                            >
                                                ✕
                                            </button>
                                        )}
                                    </div>

                                    {!searchQuery && (
                                        <div className="flex items-center space-x-2 overflow-x-auto pb-1 no-scrollbar">
                                            {MENU_CATEGORIES.map(cat => (
                                                <button
                                                    key={cat.id}
                                                    onClick={() => setSelectedCategory(cat.id)}
                                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap flex items-center space-x-1.5 transition-all ${
                                                        selectedCategory === cat.id
                                                            ? 'bg-slate-800 text-white shadow'
                                                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                                    }`}
                                                >
                                                    <i className={`fa-solid ${cat.icon}`}></i>
                                                    <span>{cat.name}</span>
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Menu Items Grid */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                    {filteredItems.map(item => (
                                        <div
                                            key={item.id}
                                            className="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition-all flex flex-col justify-between"
                                        >
                                            <div>
                                                <div className="flex justify-between items-start mb-1">
                                                    <h3 className="font-bold text-slate-800 text-base">{item.name}</h3>
                                                    <span className="font-extrabold text-red-600 text-base">
                                                        ${item.price} {item.unit && <span className="text-xs text-slate-500 font-normal">/{item.unit}</span>}
                                                    </span>
                                                </div>
                                                {item.options && (
                                                    <div className="flex flex-wrap gap-1 mt-1 mb-2">
                                                        <span className="text-[10px] bg-amber-50 text-amber-700 border border-amber-200 px-1.5 py-0.5 rounded">
                                                            可選口味/配料
                                                        </span>
                                                    </div>
                                                )}
                                            </div>

                                            <div className="mt-3 flex items-center justify-between pt-2 border-t border-slate-100">
                                                <span className="text-xs text-slate-400">
                                                    點餐者: <span className="text-slate-700 font-medium">{currentMember}</span>
                                                </span>
                                                <button
                                                    onClick={() => handleItemClick(item)}
                                                    className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1 shadow-sm transition-all"
                                                >
                                                    <i className="fa-solid fa-plus"></i>
                                                    <span>加入購物車</span>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {}
                        {/* TAB 2: CURRENT MEMBER CART */}
                        {activeTab === 'memberCart' && (
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                                    <div className="flex items-center space-x-2">
                                        <div className="bg-red-100 text-red-700 w-8 h-8 rounded-full flex items-center justify-center font-bold">
                                            {currentMember.charAt(0)}
                                        </div>
                                        <div>
                                            <h2 className="font-bold text-base text-slate-800">【{currentMember}】點餐清單</h2>
                                            <p className="text-xs text-slate-500">切換上方點餐人可協助他人修改品項</p>
                                        </div>
                                    </div>
                                    <span className="text-lg font-extrabold text-red-600">小計: ${currentMemberTotal}</span>
                                </div>

                                {currentMemberOrders.length === 0 ? (
                                    <div className="text-center py-12 text-slate-400 space-y-2">
                                        <i className="fa-solid fa-basket-shopping text-4xl text-slate-300"></i>
                                        <p>{currentMember} 目前還沒有點任何餐點喔！</p>
                                        <button
                                            onClick={() => setActiveTab('menu')}
                                            className="mt-2 text-xs bg-red-600 text-white px-4 py-2 rounded-lg font-bold"
                                        >
                                            前往菜單選餐
                                        </button>
                                    </div>
                                ) : (
                                    <div className="divide-y divide-slate-100">
                                        {currentMemberOrders.map(order => (
                                            <div key={order.id} className="py-3 flex items-center justify-between">
                                                <div>
                                                    <div className="font-bold text-slate-800">
                                                        {order.name}
                                                        {order.option && (
                                                            <span className="ml-2 text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-normal">
                                                                {order.option}
                                                            </span>
                                                        )}
                                                    </div>
                                                    <div className="text-xs text-slate-500 mt-0.5">
                                                        單價 ${order.price} × {order.qty} = <span className="font-bold text-slate-700">${order.price * order.qty}</span>
                                                    </div>
                                                </div>

                                                <div className="flex items-center space-x-3">
                                                    {/* Quantity Counter */}
                                                    <div className="flex items-center border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
                                                        <button
                                                            onClick={() => handleUpdateQty(order.id, -1)}
                                                            className="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-slate-200 font-bold"
                                                        >
                                                            -
                                                        </button>
                                                        <span className="w-8 text-center text-xs font-bold text-slate-800">{order.qty}</span>
                                                        <button
                                                            onClick={() => handleUpdateQty(order.id, 1)}
                                                            className="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-slate-200 font-bold"
                                                        >
                                                            +
                                                        </button>
                                                    </div>

                                                    <button
                                                        onClick={() => handleRemoveOrderItem(order.id)}
                                                        className="text-slate-400 hover:text-red-500 transition-colors p-1"
                                                        title="刪除品項"
                                                    >
                                                        <i className="fa-regular fa-trash-can"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {}
                        {/* TAB 3: GROUP SUMMARY & BILLING */}
                        {activeTab === 'summary' && (
                            <div className="space-y-5">
                                {/* Top Overview Card */}
                                <div className="bg-slate-900 text-white p-5 rounded-xl shadow-md flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div>
                                        <div className="text-xs text-slate-400 flex items-center space-x-2">
                                            <span>訂單模式：<strong className="text-white">{orderType}</strong></span>
                                            {orderType === '內用' && <span>(桌號: {tableNo || '未填'})</span>}
                                            <span>• 總人數：<strong className="text-white">{members.length} 人</strong></span>
                                        </div>
                                        <div className="text-2xl md:text-3xl font-extrabold mt-1 text-amber-400">
                                            總計：${groupTotalAmount} <span className="text-sm font-normal text-slate-300">({groupTotalCount} 個品項)</span>
                                        </div>
                                    </div>

                                    <button
                                        onClick={handleCopyText}
                                        className="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-lg font-bold flex items-center justify-center space-x-2 shadow transition-all"
                                    >
                                        <i className="fa-regular fa-copy"></i>
                                        <span>複製 LINE 訂單與算帳報表</span>
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    {/* Kitchen Item Summary */}
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                                        <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                                            <h3 className="font-bold text-slate-800 flex items-center space-x-2">
                                                <i className="fa-solid fa-kitchen-set text-red-600"></i>
                                                <span>廚房下單點餐總計（按品項）</span>
                                            </h3>
                                            <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium">
                                                方便向櫃檯一次點齊
                                            </span>
                                        </div>

                                        {kitchenSummary.length === 0 ? (
                                            <p className="text-xs text-slate-400 text-center py-6">目前尚無任何餐點</p>
                                        ) : (
                                            <div className="divide-y divide-slate-100">
                                                {kitchenSummary.map((item, idx) => (
                                                    <div key={idx} className="py-2.5 flex items-center justify-between">
                                                        <div>
                                                            <div className="font-bold text-slate-800 text-sm">
                                                                {item.name}
                                                                {item.option && (
                                                                    <span className="ml-1.5 text-xs bg-amber-100 text-amber-800 px-1.5 py-0.2 rounded">
                                                                        {item.option}
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <div className="text-[11px] text-slate-400 mt-0.5">
                                                                點餐人: {item.members.join(', ')}
                                                            </div>
                                                        </div>
                                                        <div className="text-right">
                                                            <span className="text-base font-extrabold text-red-600">
                                                                x {item.totalQty}
                                                            </span>
                                                            <div className="text-xs text-slate-500 font-medium">
                                                                ${item.price * item.totalQty}
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* Member Split-Bill Summary */}
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                                        <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                                            <h3 className="font-bold text-slate-800 flex items-center space-x-2">
                                                <i className="fa-solid fa-users text-blue-600"></i>
                                                <span>個人分攤收錢明細（按人員）</span>
                                            </h3>
                                            <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium">
                                                算帳神器
                                            </span>
                                        </div>

                                        <div className="space-y-3">
                                            {memberBreakdown.map((mb, idx) => (
                                                <div key={idx} className="border border-slate-100 rounded-lg p-3 bg-slate-50">
                                                    <div className="flex justify-between items-center mb-1.5 pb-1 border-b border-slate-200">
                                                        <span className="font-bold text-slate-800 text-sm flex items-center space-x-1.5">
                                                            <i className="fa-solid fa-user-tag text-xs text-slate-500"></i>
                                                            <span>{mb.member}</span>
                                                        </span>
                                                        <span className="font-extrabold text-red-600 text-sm">
                                                            應付: ${mb.total}
                                                        </span>
                                                    </div>

                                                    {mb.orders.length === 0 ? (
                                                        <p className="text-[11px] text-slate-400 italic">尚未選購餐點</p>
                                                    ) : (
                                                        <ul className="text-xs space-y-1 text-slate-600">
                                                            {mb.orders.map(o => (
                                                                <li key={o.id} className="flex justify-between">
                                                                    <span>
                                                                        • {o.name} {o.option ? `(${o.option})` : ''} x{o.qty}
                                                                    </span>
                                                                    <span className="text-slate-500 font-medium">${o.price * o.qty}</span>
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    {/* Customize Modal (Options/Flavors Selection) */}
                    {modalItem && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl animate-fade-in">
                                <div className="flex justify-between items-start border-b border-slate-100 pb-3">
                                    <div>
                                        <h3 className="font-bold text-lg text-slate-800">{modalItem.name}</h3>
                                        <p className="text-xs text-slate-500">為【{currentMember}】選擇偏好</p>
                                    </div>
                                    <button
                                        onClick={() => setModalItem(null)}
                                        className="text-slate-400 hover:text-slate-600 text-lg font-bold"
                                    >
                                        ✕
                                    </button>
                                </div>

                                {/* Option Selector */}
                                {modalItem.options && modalItem.options.length > 0 && (
                                    <div className="space-y-2">
                                        <label className="text-xs font-bold text-slate-600">請選擇配料/口味：</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {modalItem.options.map(opt => (
                                                <button
                                                    key={opt}
                                                    onClick={() => setModalOption(opt)}
                                                    className={`py-2 px-3 rounded-lg text-xs font-bold border transition-all ${
                                                        modalOption === opt
                                                            ? 'border-red-600 bg-red-50 text-red-700 shadow-sm'
                                                            : 'border-slate-200 text-slate-600 hover:bg-slate-50'
                                                    }`}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Quantity Adjuster */}
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-slate-600">數量：</label>
                                    <div className="flex items-center justify-center space-x-4 border border-slate-200 rounded-xl p-2 bg-slate-50">
                                        <button
                                            onClick={() => setModalQty(Math.max(1, modalQty - 1))}
                                            className="w-10 h-10 rounded-lg bg-white border border-slate-200 font-bold text-slate-700 hover:bg-slate-100 flex items-center justify-center text-lg shadow-sm"
                                        >
                                            -
                                        </button>
                                        <span className="text-xl font-extrabold text-slate-800 w-12 text-center">
                                            {modalQty}
                                        </span>
                                        <button
                                            onClick={() => setModalQty(modalQty + 1)}
                                            className="w-10 h-10 rounded-lg bg-white border border-slate-200 font-bold text-slate-700 hover:bg-slate-100 flex items-center justify-center text-lg shadow-sm"
                                        >
                                            +
                                        </button>
                                    </div>
                                </div>

                                <div className="pt-2 flex space-x-2">
                                    <button
                                        onClick={() => setModalItem(null)}
                                        className="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-bold text-sm hover:bg-slate-50"
                                    >
                                        取消
                                    </button>
                                    <button
                                        onClick={() => addItemToOrder(modalItem, modalOption, modalQty)}
                                        className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm shadow-md transition-all"
                                    >
                                        確定加入 (${modalItem.price * modalQty})
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

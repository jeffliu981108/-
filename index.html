<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八方雲集 即時團購點餐</title>
  <!-- 載入 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 600px; margin: auto; background-color: #f8f9fa; color: #333; }
    .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h2 { color: #d32f2f; text-align: center; margin-top: 0; }
    h3 { margin-top: 0; color: #444; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    label { font-weight: bold; margin-top: 10px; display: block; font-size: 14px; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { background-color: #d32f2f; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #b71c1c; }
    .clear-btn { background-color: #757575; margin-top: 10px; }
    .clear-btn:hover { background-color: #616161; }
    ul { padding-left: 20px; line-height: 1.8; }
    .total-box { background: #ffebee; padding: 12px; border-radius: 8px; font-weight: bold; color: #c62828; margin-top: 15px; font-size: 18px; text-align: right; }
    .delete-btn { width: auto; padding: 2px 8px; margin-left: 10px; background-color: #ef5350; font-size: 12px; display: inline-block; border-radius: 4px; }
    optgroup { font-weight: bold; color: #d32f2f; }
  </style>
</head>
<body>

  <h2>🥟 八方雲集 即時團購點餐</h2>

  <div class="card">
    <h3>1. 新增點餐</h3>
    <label>點餐者姓名：</label>
    <input type="text" id="userName" placeholder="請輸入姓名（例如：小明）">
    
    <label>選擇餐點：</label>
    <select id="itemSelect">
      <optgroup label="鍋貼類（單顆）">
        <option value="招牌鍋貼,7.0">招牌鍋貼 ($7.0)</option>
        <option value="韭菜鍋貼,7.0">韭菜鍋貼 ($7.0)</option>
        <option value="韓式辣味鍋貼,7.0">韓式辣味鍋貼 ($7.0)</option>
        <option value="咖哩雞肉鍋貼,7.0">咖哩雞肉鍋貼 ($7.0)</option>
        <option value="玉米鍋貼,7.0">玉米鍋貼 ($7.0)</option>
        <option value="新蔬食鍋貼,7.5">新蔬食鍋貼 ($7.5)</option>
      </optgroup>
      
      <optgroup label="水餃類（單顆）">
        <option value="招牌水餃,7.0">招牌水餃 ($7.0)</option>
        <option value="韭菜水餃,7.0">韭菜水餃 ($7.0)</option>
        <option value="韓式辣味水餃,7.0">韓式辣味水餃 ($7.0)</option>
        <option value="咖哩雞肉水餃,7.0">咖哩雞肉水餃 ($7.0)</option>
        <option value="玉米水餃,7.0">玉米水餃 ($7.0)</option>
        <option value="新蔬食水餃,7.5">新蔬食水餃 ($7.5)</option>
        <option value="鮮蝦水餃,10.5">鮮蝦水餃 ($10.5)</option>
      </optgroup>

      <optgroup label="經典牛肉麵系列">
        <option value="紅燒牛肉麵,168">紅燒牛肉麵 ($168)</option>
        <option value="清燉牛肉麵,168">清燉牛肉麵 ($168)</option>
        <option value="麻辣牛肉麵,178">麻辣牛肉麵 ($178)</option>
        <option value="紅燒牛肉湯餃,120">紅燒牛肉湯餃 ($120)</option>
        <option value="麻辣牛肉湯餃,125">麻辣牛肉湯餃 ($125)</option>
      </optgroup>

      <optgroup label="乾麵 / 湯麵">
        <option value="古早味乾麵,45">古早味乾麵 ($45)</option>
        <option value="麻醬乾麵,55">麻醬乾麵 ($55)</option>
        <option value="紹辣乾麵,60">紹辣乾麵 ($60)</option>
        <option value="古早味湯麵,45">古早味湯麵 ($45)</option>
        <option value="酸辣湯麵,70">酸辣湯麵 ($70)</option>
        <option value="珍珠餛飩麵,70">珍珠餛飩麵 ($70)</option>
      </optgroup>

      <optgroup label="湯品">
        <option value="酸辣湯,35">酸辣湯 ($35)</option>
        <option value="玉米濃湯,35">玉米濃湯 ($35)</option>
        <option value="旗魚花枝丸湯,35">旗魚花枝丸湯 ($35)</option>
        <option value="蘿蔔湯,35">蘿蔔湯 ($35)</option>
      </optgroup>

      <optgroup label="飲品">
        <option value="香濃豆漿,20">香濃豆漿 ($20)</option>
        <option value="香濃豆漿(無糖),20">香濃豆漿(無糖) ($20)</option>
        <option value="黑豆漿,20">黑豆漿 ($20)</option>
        <option value="真傳特調紅茶,20">真傳特調紅茶 ($20)</option>
      </optgroup>
    </select>

    <label>數量：</label>
    <input type="number" id="itemQty" value="1" min="1">

    <button onclick="submitOrder()">加入團購單</button>
  </div>

  <div class="card">
    <h3>2. 個人點餐明細（即時同步）</h3>
    <div id="orderList">載入中...</div>
    <div class="total-box">全團總金額：$<span id="grandTotal">0</span> 元</div>
  </div>

  <div class="card">
    <h3>3. 廚房彙整表（向店家下單）</h3>
    <div id="summaryList">尚無點餐資料</div>
    <button class="clear-btn" onclick="clearAllOrders()">清空所有點餐資料</button>
  </div>

  <script>
    // 您的專屬 Firebase 金鑰設定
    const firebaseConfig = {
      apiKey: "AIzaSyCcbh1KULGbavZY7-rfBuxTMtggHexdn08",
      authDomain: "jeffliu-32381.firebaseapp.com",
      databaseURL: "https://jeffliu-32381-default-rtdb.firebaseio.com",
      projectId: "jeffliu-32381",
      storageBucket: "jeffliu-32381.firebasestorage.app",
      messagingSenderId: "775805742579",
      appId: "1:775805742579:web:430afd9ae0c7495d55b686"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const ordersRef = database.ref('orders');

    function submitOrder() {
      const name = document.getElementById('userName').value.trim();
      const [itemName, price] = document.getElementById('itemSelect').value.split(',');
      const qty = parseInt(document.getElementById('itemQty').value);

      if (!name) {
        alert("請輸入您的姓名！");
        return;
      }

      ordersRef.push({
        name: name,
        item: itemName,
        price: parseFloat(price),
        qty: qty,
        timestamp: Date.now()
      });
    }

    function deleteOrder(key) {
      if (confirm("確定要刪除這筆餐點嗎？")) {
        ordersRef.child(key).remove();
      }
    }

    function clearAllOrders() {
      if (confirm("確定要清空全團的點餐紀錄嗎？")) {
        ordersRef.remove();
      }
    }

    ordersRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const orderListDiv = document.getElementById('orderList');
      const summaryListDiv = document.getElementById('summaryList');
      const grandTotalSpan = document.getElementById('grandTotal');

      if (!data) {
        orderListDiv.innerHTML = "目前尚無人點餐";
        summaryListDiv.innerHTML = "尚無點餐資料";
        grandTotalSpan.textContent = "0";
        return;
      }

      let grandTotal = 0;
      let orderHtml = "<ul>";
      let summaryMap = {};

      Object.keys(data).forEach((key) => {
        const ord = data[key];
        const subtotal = ord.price * ord.qty;
        grandTotal += subtotal;

        orderHtml += `<li><strong>${ord.name}</strong>：${ord.item} x ${ord.qty} ($${subtotal}元) <button class="delete-btn" onclick="deleteOrder('${key}')">刪除</button></li>`;

        if (!summaryMap[ord.item]) summaryMap[ord.item] = 0;
        summaryMap[ord.item] += ord.qty;
      });

      orderHtml += "</ul>";
      orderListDiv.innerHTML = orderHtml;
      grandTotalSpan.textContent = grandTotal;

      let summaryHtml = "<ul>";
      for (const [item, count] of Object.entries(summaryMap)) {
        summaryHtml += `<li>${item}：<strong>${count}</strong> 份/顆</li>`;
      }
      summaryHtml += "</ul>";
      summaryListDiv.innerHTML = summaryHtml;
    });
  </script>
</body>
</html>
